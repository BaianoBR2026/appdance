[build]
  publish = "."
  command = ""

[[headers]]
  for = "/app/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=AppDance.apk"
    Cache-Control = "no-cache"

[[headers]]
  for = "/app/versao.json"
  [headers.values]
    Cache-Control = "no-cache"
