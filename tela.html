<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AppDance - Telão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<style>
:root{--pink:#ff2d7a;--cyan:#22d3ee;--yel:#facc15;--ok:#4ade80;--bad:#f87171;--fg:#f4f1fa;--mut:#a59fb5;--panel:#1b1724;--panel2:#262033}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif;overflow:hidden}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;visibility:hidden}
#gc,#bgc,#g3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;background:#0b0910f5;text-align:center;padding:2vh 2vw;overflow:auto}
h1{font-size:5vh;margin:0}
h1 span{color:var(--pink)}
.cols{display:flex;gap:1.4vw;flex-wrap:wrap;justify-content:center;align-items:stretch;width:100%;max-width:1700px}
.card{background:var(--panel);border-radius:16px;padding:1.8vh 1.4vw;flex:1 1 300px;max-width:560px;display:flex;flex-direction:column;gap:1vh;align-items:center}
.card h2{font-size:2.6vh;margin:0}
.st{font-size:1.9vh;color:var(--mut);line-height:1.35}
.st b{color:var(--ok)}
.conn{display:flex;gap:1.2vw;align-items:center;justify-content:center;flex-wrap:wrap}
#code{font-size:7.5vh;font-weight:900;letter-spacing:.8vh;color:var(--pink);line-height:1}
#qr{background:#fff;padding:6px;border-radius:10px;line-height:0}
#url{color:var(--cyan);word-break:break-all}
#mini{background:#000;border-radius:10px;width:min(240px,70%);aspect-ratio:4/3}
button{font:inherit;font-size:2.3vh;font-weight:800;padding:1.1vh 2.8vh;border:0;border-radius:999px;background:var(--pink);color:#fff;cursor:pointer}
button:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
button.sec{background:#3a3248}
button.small{font-size:1.8vh;padding:.9vh 1.8vh}
.games{display:grid;grid-template-columns:1fr 1fr;gap:.9vh;width:100%}
.gbtn{background:var(--panel2);border-radius:12px;padding:1.1vh 1vw;text-align:left;font-size:2.2vh;font-weight:800;border:3px solid transparent;color:var(--fg)}
.gbtn:first-child{grid-column:span 2}
.gbtn small{display:block;font-weight:500;color:var(--mut);font-size:1.6vh;margin-top:.3vh}
.gbtn.sel{border-color:var(--pink);background:#33203a}
#gdesc{min-height:4.2vh}
.chips{display:flex;gap:.8vw;flex-wrap:wrap;justify-content:center;min-height:3.4vh}
.chip{padding:.5vh 1.2vw;border-radius:999px;font-weight:800;font-size:1.8vh;color:#000}
#dancebox{width:100%;display:flex;flex-direction:column;gap:.9vh;align-items:center;border-top:1px solid #3a3248;padding-top:1vh}
.bar{width:100%;height:1.1vh;background:#2a2436;border-radius:1vh;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cyan)}
.row{display:flex;gap:1.2vw;flex-wrap:wrap;justify-content:center;align-items:center}
.pick{display:flex;flex-direction:column;align-items:center;gap:.5vh;background:var(--panel2);border-radius:14px;padding:.8vh .5vw;border-top:.7vh solid;min-width:0}
.pick canvas{width:9vh;height:11.5vh}
.pick b{font-size:1.7vh}
#gohint{color:var(--yel);min-height:2.4vh}
#countov{background:#0007}
#count{font-size:30vh;font-weight:900;color:var(--pink);line-height:1}
#counthint{font-size:3.5vh;font-weight:800}
#rank{display:flex;flex-direction:column;gap:1vh;min-width:min(640px,90vw)}
.rk{display:flex;justify-content:space-between;align-items:center;gap:2vw;background:var(--panel);border-radius:12px;padding:1.4vh 2vw;font-size:3vh;font-weight:800;border-left:1.4vh solid}
.rk span:last-child{color:var(--mut);font-size:2.4vh;text-align:right}
#winner{font-size:6vh;font-weight:900}
</style></head><body>
<video id="vid" playsinline preload="auto"></video>
<canvas id="bgc"></canvas>
<canvas id="g3d"></canvas>
<canvas id="gc"></canvas>

<div class="ov" id="lobby">
 <h1>App<span>Dance</span></h1>
 <div class="cols">
  <div class="card">
   <h2>1. Conecte o celular (a câmera)</h2>
   <div class="st">No celular, leia o QR code. Ou abra <span id="url">...</span> e digite:</div>
   <div class="conn"><div id="code">----</div><div id="qr"></div></div>
   <div class="st" id="status">Preparando a conexão...</div>
   <canvas id="mini" width="320" height="240"></canvas>
   <div class="chips" id="seen"></div>
  </div>
  <div class="card">
   <h2>2. Escolha o jogo</h2>
   <div class="games" id="games"></div>
   <div class="st" id="gdesc"></div>
   <div id="dancebox">
    <div class="st">O vídeo da dança é escolhido e preparado no celular.</div>
    <button class="sec small" id="sample">Usar vídeo de exemplo</button>
    <div class="bar"><i id="pfill"></i></div>
    <div class="st" id="pstat"></div>
   </div>
  </div>
  <div class="card">
   <h2>3. Personagens</h2>
   <div class="st">Cada jogador escolhe o seu. Clique para trocar.</div>
   <div class="row" id="picks"></div>
  </div>
 </div>
 <div id="diag" class="st" style="font-size:1.6vh"></div>
 <div id="gohint" class="st"></div>
 <div class="row"><button id="go" disabled>Começar</button><button class="sec" id="fs">Tela cheia</button></div>
</div>

<div class="ov" id="countov" hidden><div id="count">3</div><div id="counthint"></div></div>

<div class="ov" id="res" hidden>
 <h1 id="rtitle">Fim de jogo!</h1>
 <div id="winner"></div>
 <div id="rank"></div>
 <div class="row"><button id="again">Jogar de novo</button><button class="sec" id="tomenu">Menu</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="personagens.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="char3d.js"></script>
<script>
// O telão só MOSTRA: recebe do celular o que desenhar, toca o vídeo e os sons.
const SITE_ONLINE="https://appdance.netlify.app/"; // usado quando o telão é aberto direto do PC (arquivo)
const COLORS=['#ff2d7a','#22d3ee','#facc15'];
const PAL=['#ff2d7a','#22d3ee','#a78bfa','#4ade80','#fb923c'];
const IDX=[0,11,12,13,14,15,16,19,20,23,24,25,26,27,28];
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const GLIST=[
 {id:'danca',nome:'Dança',curta:'Copie o dançarino do vídeo',desc:'Copiem os movimentos do vídeo, espelhado. Cada jogador ganha nota a cada segundo.'},
 {id:'baloes',nome:'Estoura Balões',curta:'Estoure com as mãos',desc:'Estourem os balões com as mãos. Dourado vale 3, bomba tira 3. 60 segundos.'},
 {id:'corrida',nome:'Corrida Parada',curta:'Corra sem sair do lugar',desc:'Corram no lugar levantando os joelhos. Primeiro a 50 passos vence.'},
 {id:'estatua',nome:'Estátua',curta:'Dance e congele',desc:'Dancem com a música e congelem quando aparecer ESTÁTUA. Quem se mexer sai.'},
 {id:'desvia',nome:'Desvia!',curta:'Fuja das bolas de fogo',desc:'Desviem das bolas de fogo com o corpo todo. 3 vidas cada. 60 segundos.'}
];
const CHARS=window.CUTE?Object.keys(CUTE).map(id=>[id,CUTE[id].nome]):[['palito','Palito']];
const STY={
 robo:{body:'#9aa5b1',limb:'#7b8794',dark:'#323f4b',hand:'#cbd2d9'},
 ninja:{body:'#1f2933',limb:'#2d3a48',dark:'#05070a',hand:'#2d3a48'},
 gato:{body:'#f59e0b',limb:'#fbbf24',dark:'#7c2d12',hand:'#fde68a'},
 astro:{body:'#f5f7fa',limb:'#e4e7eb',dark:'#7b8794',hand:'#cbd2d9'},
 heroi:{body:'#2563eb',limb:'#1d4ed8',dark:'#172554',hand:'#dc2626'}
};

const $=id=>document.getElementById(id);
const vid=$('vid'),gc=$('gc'),ctx=gc.getContext('2d');
let peer=null,conn=null,fast=null,code='',tstate='wait';   // wait | lobby | count | play | res
let scene=null,sceneAt=0,lastSeq=0,feedAr=4/3,tick=null,chars=['urso','cachorro','coelho'];
let CW=0,CH=0,FX=0,FY=0,FW=0,FH=0,rscale=1,bgKey='',use3D=false,was3D=false;
const hist={};      // histórico de cada jogador, para prever o movimento entre pacotes
const bgCache={};

// ================= tela =================
function resize(){CW=gc.width=Math.round(innerWidth*rscale);CH=gc.height=Math.round(innerHeight*rscale);fit();for(const k in bgCache)delete bgCache[k];
 const b=document.getElementById('bgc');if(b){b.width=CW;b.height=CH;bgKey='';}
 if(use3D&&window.Fofo3D)Fofo3D.resize(CW,CH);}
function fit(){FW=CW;FH=FW/feedAr;if(FH>CH){FH=CH;FW=FH*feedAr;}FX=(CW-FW)/2;FY=(CH-FH)/2;}
use3D=!/[?&]2d/.test(location.search)&&!!(window.Fofo3D&&Fofo3D.init(document.getElementById('g3d')));
addEventListener('resize',resize);resize();
function unpack(arr){if(!arr)return null;const k=new Array(33).fill(null);IDX.forEach((idx,j)=>{const a=arr[j];if(a)k[idx]={x:a[0],y:a[1],v:a[2]};});return k;}
function vis(p){return p?p.v:0;}
function scr(p){return [FX+(1-p.x)*FW,FY+p.y*FH];}
function fx2(x){return FX+x*FW;} function fy2(y){return FY+y*FH;}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function fmt(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// ================= personagens =================
function drawStick(g,k,col,map,lw){
 g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';
 for(const [a,b] of BONES){if(vis(k[a])<0.4||vis(k[b])<0.4)continue;const pa=map(k[a]),pb=map(k[b]);g.beginPath();g.moveTo(pa[0],pa[1]);g.lineTo(pb[0],pb[1]);g.stroke();}
 if(vis(k[0])>0.4&&vis(k[11])>0.4&&vis(k[12])>0.4){const p=map(k[0]),a=map(k[11]),b=map(k[12]);g.beginPath();g.arc(p[0],p[1],Math.max(8,Math.hypot(a[0]-b[0],a[1]-b[1])*0.35),0,Math.PI*2);g.stroke();}
}
// desenha o personagem "vestido" no esqueleto. opt: {alpha, gray, label}
function drawChar(g,k,map,ch,col,opt){
 if(window.drawCute&&window.CUTE&&CUTE[ch])return drawCute(g,k,map,ch,col,Object.assign({t:performance.now(),seed:Math.max(0,COLORS.indexOf(col))},opt||{}));
 return drawOld(g,k,map,ch,col,opt);
}
function drawOld(g,k,map,ch,col,opt){
 if(!k)return;opt=opt||{};
 g.save();
 g.globalAlpha=opt.alpha||1;
 if(opt.gray)g.filter='grayscale(1) brightness(.6)';
 const P=i=>vis(k[i])>0.35?map(k[i]):null;
 const ls=P(11),rs=P(12);
 const sw=ls&&rs?Math.max(12,Math.hypot(ls[0]-rs[0],ls[1]-rs[1])):40;
 if(ch==='palito'||!STY[ch]){drawStick(g,k,col,map,Math.max(4,sw*0.12));drawLabel(g,k,map,sw,col,opt.label);g.restore();return;}
 const S=STY[ch],W=Math.max(6,sw*0.3);
 g.lineCap='round';g.lineJoin='round';
 let lh=P(23),rh=P(24);
 if(ls&&rs&&(!lh||!rh)){lh=[ls[0],ls[1]+sw*1.3];rh=[rs[0],rs[1]+sw*1.3];}
 const limb=(a,b,c,w,color)=>{
  const pa=P(a),pb=P(b);if(!pa||!pb)return;const pc=P(c);
  g.beginPath();g.moveTo(pa[0],pa[1]);g.lineTo(pb[0],pb[1]);if(pc)g.lineTo(pc[0],pc[1]);
  g.strokeStyle=S.dark;g.lineWidth=w+5;g.stroke();g.strokeStyle=color;g.lineWidth=w;g.stroke();
 };
 // capa do herói (atrás do corpo)
 if(ch==='heroi'&&ls&&rs&&lh&&rh){
  const cy=Math.max(lh[1],rh[1])+sw*0.9;
  g.fillStyle='#dc2626';g.beginPath();g.moveTo(ls[0],ls[1]);g.lineTo(rs[0],rs[1]);g.lineTo(rs[0]+(rs[0]-ls[0])*0.35,cy);g.lineTo(ls[0]-(rs[0]-ls[0])*0.35,cy);g.closePath();g.fill();
 }
 // pernas e pés
 limb(23,25,27,W*1.15,S.limb);limb(24,26,28,W*1.15,S.limb);
 for(const f of [27,28]){const p=P(f);if(!p)continue;g.fillStyle=S.dark;g.beginPath();g.ellipse(p[0],p[1]+W*0.2,W*0.85,W*0.5,0,0,Math.PI*2);g.fill();}
 // tronco
 if(ls&&rs&&lh&&rh){
  g.beginPath();g.moveTo(ls[0],ls[1]);g.lineTo(rs[0],rs[1]);g.lineTo(rh[0],rh[1]);g.lineTo(lh[0],lh[1]);g.closePath();
  g.strokeStyle=S.dark;g.lineWidth=W*0.9+5;g.stroke();g.strokeStyle=S.body;g.lineWidth=W*0.9;g.stroke();g.fillStyle=S.body;g.fill();
  const cx=(ls[0]+rs[0]+lh[0]+rh[0])/4,cy=(ls[1]+rs[1]+lh[1]+rh[1])/4;
  // detalhe no peito com a cor do jogador
  g.fillStyle=col;
  if(ch==='robo'){rr(g,cx-sw*0.18,cy-sw*0.25,sw*0.36,sw*0.3,4);g.fill();g.fillStyle='#22d3ee';g.fillRect(cx-sw*0.1,cy-sw*0.16,sw*0.2,sw*0.06);}
  else if(ch==='ninja'){g.fillRect(lh[0],(lh[1]+rh[1])/2-W*0.4,rh[0]-lh[0],W*0.5);}
  else if(ch==='gato'){g.beginPath();g.ellipse(cx,cy+sw*0.05,sw*0.22,sw*0.3,0,0,Math.PI*2);g.fillStyle='#fde68a';g.fill();g.fillStyle=col;g.beginPath();g.arc(cx,cy-sw*0.3,sw*0.07,0,Math.PI*2);g.fill();}
  else if(ch==='astro'){rr(g,cx-sw*0.2,cy-sw*0.2,sw*0.4,sw*0.26,5);g.fill();g.fillStyle='#ef4444';g.beginPath();g.arc(cx-sw*0.08,cy-sw*0.07,sw*0.04,0,7);g.fill();g.fillStyle='#22c55e';g.beginPath();g.arc(cx+sw*0.06,cy-sw*0.07,sw*0.04,0,7);g.fill();}
  else if(ch==='heroi'){g.beginPath();g.moveTo(cx,cy-sw*0.3);g.lineTo(cx+sw*0.22,cy-sw*0.05);g.lineTo(cx,cy+sw*0.2);g.lineTo(cx-sw*0.22,cy-sw*0.05);g.closePath();g.fill();g.fillStyle='#facc15';g.fillRect(lh[0],(lh[1]+rh[1])/2-W*0.35,rh[0]-lh[0],W*0.4);}
 }
 // braços e mãos
 limb(11,13,15,W,S.limb);limb(12,14,16,W,S.limb);
 for(const h of [15,16]){const p=P(h);if(!p)continue;g.fillStyle=S.hand;g.strokeStyle=S.dark;g.lineWidth=3;g.beginPath();g.arc(p[0],p[1],W*0.62,0,Math.PI*2);g.fill();g.stroke();}
 // cabeça
 let hc=P(0);
 if(!hc&&ls&&rs)hc=[(ls[0]+rs[0])/2,(ls[1]+rs[1])/2-sw*0.55];
 if(hc){
  const R=sw*0.4,ang=ls&&rs?Math.atan2(rs[1]-ls[1],rs[0]-ls[0]):0;
  const tilt=Math.abs(ang)>Math.PI/2?ang-Math.PI*Math.sign(ang):ang;
  g.save();g.translate(hc[0],hc[1]);g.rotate(tilt);
  g.lineWidth=3;g.strokeStyle=S.dark;
  if(ch==='robo'){
   g.strokeStyle=S.dark;g.lineWidth=3;g.beginPath();g.moveTo(0,-R);g.lineTo(0,-R*1.5);g.stroke();
   g.fillStyle=col;g.beginPath();g.arc(0,-R*1.6,R*0.18,0,7);g.fill();
   g.fillStyle=S.body;rr(g,-R,-R,R*2,R*1.9,R*0.3);g.fill();g.stroke();
   g.fillStyle='#0b1020';rr(g,-R*0.75,-R*0.45,R*1.5,R*0.6,R*0.2);g.fill();
   g.fillStyle='#22d3ee';g.fillRect(-R*0.55,-R*0.25,R*0.35,R*0.2);g.fillRect(R*0.2,-R*0.25,R*0.35,R*0.2);
   g.fillStyle=S.dark;g.fillRect(-R*0.4,R*0.45,R*0.8,R*0.12);
  }else if(ch==='ninja'){
   g.fillStyle=S.body;g.beginPath();g.arc(0,0,R,0,7);g.fill();g.stroke();
   g.fillStyle='#f0c8a0';rr(g,-R*0.8,-R*0.3,R*1.6,R*0.45,R*0.2);g.fill();
   g.fillStyle='#000';g.beginPath();g.ellipse(-R*0.32,-R*0.08,R*0.14,R*0.09,0,0,7);g.ellipse(R*0.32,-R*0.08,R*0.14,R*0.09,0,0,7);g.fill();
   g.fillStyle=col;g.fillRect(-R*1.02,-R*0.62,R*2.04,R*0.22);
   g.beginPath();g.moveTo(R*0.95,-R*0.55);g.lineTo(R*1.6,-R*0.2);g.lineTo(R*1.5,-R*0.05);g.closePath();g.fill();
  }else if(ch==='gato'){
   g.fillStyle=S.body;
   g.beginPath();g.moveTo(-R*0.9,-R*0.3);g.lineTo(-R*0.7,-R*1.3);g.lineTo(-R*0.15,-R*0.8);g.closePath();g.fill();g.stroke();
   g.beginPath();g.moveTo(R*0.9,-R*0.3);g.lineTo(R*0.7,-R*1.3);g.lineTo(R*0.15,-R*0.8);g.closePath();g.fill();g.stroke();
   g.beginPath();g.arc(0,0,R,0,7);g.fill();g.stroke();
   g.fillStyle='#fde68a';g.beginPath();g.ellipse(0,R*0.35,R*0.5,R*0.38,0,0,7);g.fill();
   g.fillStyle='#14532d';g.beginPath();g.ellipse(-R*0.38,-R*0.12,R*0.13,R*0.2,0,0,7);g.ellipse(R*0.38,-R*0.12,R*0.13,R*0.2,0,0,7);g.fill();
   g.fillStyle=col;g.beginPath();g.moveTo(-R*0.12,R*0.18);g.lineTo(R*0.12,R*0.18);g.lineTo(0,R*0.32);g.closePath();g.fill();
   g.strokeStyle=S.dark;g.lineWidth=1.5;g.beginPath();
   for(const s of [-1,1])for(const dy of [0.3,0.45]){g.moveTo(s*R*0.3,R*dy);g.lineTo(s*R*1.05,R*(dy-0.08));}
   g.stroke();
  }else if(ch==='astro'){
   g.fillStyle=S.body;g.beginPath();g.arc(0,0,R*1.15,0,7);g.fill();g.stroke();
   g.fillStyle='#0f172a';g.beginPath();g.ellipse(0,R*0.05,R*0.85,R*0.65,0,0,7);g.fill();
   g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-R*0.35,-R*0.2,R*0.2,R*0.12,-0.5,0,7);g.fill();
   g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.ellipse(0,R*0.05,R*0.85,R*0.65,0,0,7);g.stroke();
  }else if(ch==='heroi'){
   g.fillStyle='#f0c8a0';g.beginPath();g.arc(0,0,R,0,7);g.fill();g.stroke();
   g.fillStyle='#1c1917';g.beginPath();g.arc(0,-R*0.15,R*1.02,Math.PI*1.05,Math.PI*1.95);g.fill();
   g.fillStyle=col;rr(g,-R*0.85,-R*0.3,R*1.7,R*0.38,R*0.18);g.fill();
   g.fillStyle='#fff';g.beginPath();g.ellipse(-R*0.35,-R*0.11,R*0.15,R*0.09,0,0,7);g.ellipse(R*0.35,-R*0.11,R*0.15,R*0.09,0,0,7);g.fill();
   g.strokeStyle='#7f1d1d';g.lineWidth=2;g.beginPath();g.arc(0,R*0.35,R*0.28,0.2,Math.PI-0.2);g.stroke();
  }
  g.restore();
 }
 drawLabel(g,k,map,sw,col,opt.label);
 g.restore();
}
function drawLabel(g,k,map,sw,col,label){
 if(!label)return;
 let p=vis(k[0])>0.35?map(k[0]):null;

// ================= previsão de movimento =================
// Compensação de atraso: usa a velocidade de cada ponto do corpo e desenha o personagem
// "um pouco no futuro", o equivalente ao tempo que a imagem levou da câmera até aqui.
let rtt=30,pipeLat=60,lagMode=1;   // lagMode: 1 = compensação ligada
function storePlayers(m,now){
 const seen=new Set();
 if(m.lt)pipeLat=pipeLat*0.8+m.lt*0.2;
 for(const p of m.pl||[]){
  seen.add(p.c);
  const h=hist[p.c]||(hist[p.c]={});
  const k=unpack(p.k);
  if(k){
   const ts=m.ts||now;
   if(h.ck&&ts>h.cts){                                   // imagem nova da câmera
    const dt=ts-h.cts;
    if(dt<200){
     h.v=k.map((pt,i)=>{const q=h.ck[i];if(!pt||!q||pt.v<0.4||q.v<0.4)return null;
      const vx=(pt.x-q.x)/dt,vy=(pt.y-q.y)/dt,o=h.v&&h.v[i];
      return o?{x:o.x*0.4+vx*0.6,y:o.y*0.4+vy*0.6}:{x:vx,y:vy};});
    }else h.v=null;
    h.ck=k;h.cts=ts;h.ct=now;
   }else if(!h.ck){h.ck=k;h.cts=ts;h.ct=now;h.v=null;}
  }else{h.ck=null;h.v=null;}
  h.g=p.g;h.b=p.b;h.x=p.x;
 }
 for(const c in hist)if(!seen.has(+c))delete hist[c];
}
function kNow(c,now){
 const h=hist[c];if(!h||!h.ck)return null;
 if(!lagMode||!h.v)return h.ck;
 // quanto prever: parte do atraso câmera+rede, com limite (prever demais faz tremer)
 const ahead=Math.min(90,(pipeLat*0.5+rtt/2)*0.6+(now-h.ct)*0.8);
 return h.ck.map((p,i)=>{
  const v=h.v[i];if(!p||!v)return p;
  const sp=Math.hypot(v.x,v.y);
  if(sp<0.0002)return p;                                    // parado (ou tremidinha): não prevê nada
  const k=Math.min(1,(sp-0.0002)/0.0006);                   // entra suave conforme a velocidade
  let dx=v.x*ahead*k,dy=v.y*ahead*k;
  const m=Math.hypot(dx,dy);if(m>0.06){dx*=0.06/m;dy*=0.06/m;}   // limita para não "passar do ponto"
  return{x:p.x+dx,y:p.y+dy,v:p.v};
 });
}

let connKind='';
async function checkConnKind(){
 try{
  const pc=(fast&&fast.peerConnection)||(conn&&conn.peerConnection);if(!pc)return;
  const stats=await pc.getStats();let pair=null;const cands={};
  stats.forEach(s=>{if(s.type==='candidate-pair'&&s.state==='succeeded'&&(s.nominated||s.selected))pair=s;if(s.type==='local-candidate'||s.type==='remote-candidate')cands[s.id]=s;});
  if(!pair)return;
  const l=cands[pair.localCandidateId],r=cands[pair.remoteCandidateId];
  const t=[l&&l.candidateType,r&&r.candidateType];
  connKind=t.includes('relay')?'por servidor (mais lento)':(t[0]==='host'&&t[1]==='host')?'direta pelo Wi-Fi':'pela internet';
 }catch(_){}
}

 const key=chars.join(',');if(key===picksKey&&!force)return;picksKey=key;
 document.querySelectorAll('.pick').forEach((d,i)=>{
  d.querySelector('b').textContent='J'+(i+1)+': '+charName(chars[i]);
  const c=d.querySelector('canvas'),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
  drawChar(g,SAMPLE,p=>[(1-p.x)*c.width,p.y*c.height],chars[i],COLORS[i],{});
 });
}
function markGame(id){
 document.querySelectorAll('.gbtn').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
 const G=GLIST.find(x=>x.id===id);if(G)$('gdesc').textContent=G.desc+' De 1 a 3 jogadores.';
 $('dancebox').hidden=id!=='danca';
}
function showLobby(m){
 if(m.ar&&Math.abs(m.ar-feedAr)>0.01){feedAr=m.ar;fit();}
 if(m.ch){chars=m.ch.slice(0,3);renderPicks();}
 if(m.dg){
  pipeLat=m.dg.lt||pipeLat;
  const slow=m.dg.det>60;
  $('diag').innerHTML='Conexão '+(connKind||'...')+' · rede '+Math.round(rtt/2)+' ms · câmera '+(m.dg.lt||'?')+' ms ('+(m.dg.gpu?'GPU':'CPU')+', '+m.dg.det+' ms por imagem'+(m.dg.app?', app':', navegador')+')'+
   (connKind&&connKind!=='direta pelo Wi-Fi'?'<br><b style="color:var(--yel)">Dica: coloque o celular no mesmo Wi-Fi do telão e desligue os dados móveis.</b>':'')+
   (slow?'<br><b style="color:var(--yel)">No menu o celular procura até 3 pessoas e fica mais lento; no jogo ele procura só os jogadores. Feche outros apps.</b>':'');
 }
 markGame(m.sel);
 $('gohint').textContent=m.why||'';$('go').disabled=!!m.why;
 if(m.dance){$('pstat').textContent=m.dance.t;$('pfill').style.width=(m.dance.p||0)+'%';}
 const ps=(m.ps||[]).map(unpack);
 $('seen').innerHTML=ps.map((k,i)=>'<span class="chip" style="background:'+COLORS[i]+'">Jogador '+(i+1)+'</span>').join('')||'<span class="st">Ninguém na frente da câmera</span>';
 const mc=$('mini'),mx=mc.getContext('2d');mx.fillStyle='#000';mx.fillRect(0,0,mc.width,mc.height);
 let W=mc.width,H=W/feedAr;if(H>mc.height){H=mc.height;W=H*feedAr;}
 const ox=(mc.width-W)/2,oy=(mc.height-H)/2;
 ps.forEach((k,i)=>drawChar(mx,k,p=>[ox+(1-p.x)*W,oy+p.y*H],chars[i],COLORS[i],{}));
}
function goLobby(){
 tstate=conn?'lobby':'wait';scene=null;snd.music(false);
 for(const c in hist)delete hist[c];
 $('res').hidden=true;$('countov').hidden=true;$('lobby').hidden=false;
}

// ================= vídeo da dança =================
let vidUrl=null;
function loadVideoSrc(src){vid.src=src;vid.load();}
vid.addEventListener('loadeddata',()=>send({type:'vready'}));
vid.addEventListener('error',()=>{if(vid.getAttribute('src'))send({type:'verr'});});
vid.addEventListener('ended',()=>{clearInterval(tick);tick=null;send({type:'vended'});});
function vplay(){
 vid.pause();vid.currentTime=0;vid.style.visibility='visible';
 vid.muted=false;vid.play().catch(()=>{vid.muted=true;vid.play();});
 clearInterval(tick);tick=setInterval(()=>send({type:'t',t:vid.currentTime}),200);
}
function vstop(){clearInterval(tick);tick=null;vid.pause();vid.style.visibility='hidden';}

// ================= conexão =================
function send(m){if(conn&&conn.open)conn.send(m);}
function setStatus(h){$('status').innerHTML=h;}
function phoneUrl(){const base=location.protocol==='file:'?SITE_ONLINE:new URL('.',location.href).href;return base+'celular.html#'+code;}
function startPeer(){
 code=String(Math.floor(1000+Math.random()*9000));
 $('code').textContent=code;
 if(!window.Peer){setStatus('Não consegui carregar a conexão. Verifique a internet e recarregue.');return;}
 peer=new Peer('jdanca-'+code);
 peer.on('open',()=>{
  const u=phoneUrl();
  $('url').textContent=u.replace(/^https?:\/\//,'').replace(/#.*/,'');
  $('qr').innerHTML='';
  if(window.QRCode)new QRCode($('qr'),{text:u,width:150,height:150});
  if(!conn)setStatus('Esperando o celular conectar...');
 });
 peer.on('connection',c=>{
  if(c.label==='fast'){                       // canal rápido das cenas
   if(fast&&fast.open&&fast.peer!==c.peer){c.on('open',()=>setTimeout(()=>c.close(),300));return;}
   fast=c;c.on('data',onMsg);c.on('close',()=>{if(fast===c)fast=null;});return;
  }
  if(conn&&conn.open){c.on('open',()=>{c.send({type:'busy'});setTimeout(()=>c.close(),800);});return;}
  conn=c;lastSeq=0;
  c.on('open',()=>{tstate='lobby';setStatus('<b>Celular conectado!</b> Ele é a câmera e o cérebro do jogo.');});
  c.on('data',onMsg);
  c.on('close',()=>{
   if(conn!==c)return;
   conn=null;if(fast){try{fast.close();}catch(_){}fast=null;}
   vstop();goLobby();tstate='wait';
   $('go').disabled=true;$('gohint').textContent='';$('seen').innerHTML='';
   setStatus('O celular desconectou. Leia o QR code de novo para reconectar.');
  });
 });
 peer.on('error',e=>{
  if(e.type==='unavailable-id'){peer.destroy();startPeer();}
  else if(e.type!=='peer-unavailable')setStatus('Erro de conexão ('+e.type+'). Verifique a internet e recarregue a página.');
 });
 peer.on('disconnected',()=>{try{peer.reconnect();}catch(_){}});
}
function onMsg(m){
 if(!m||!m.type)return;
 if(m.type==='pong'){const r=performance.now()-m.t;if(r>0&&r<2000)rtt=rtt*0.7+r*0.3;return;}
 if(m.s){if(m.s<=lastSeq)return;lastSeq=m.s;}       // descarta pacote velho que chegou atrasado
 switch(m.type){
  case 'lobby':
   if(tstate!=='lobby'&&tstate!=='wait')return;      // só vale no menu
   tstate='lobby';showLobby(m);break;
  case 'count':
   if(m.c>0){
    tstate='count';$('lobby').hidden=true;$('res').hidden=true;
    $('count').textContent=m.c;$('counthint').textContent=m.n+(m.n>1?' jogadores':' jogador')+' · '+m.nome;$('countov').hidden=false;snd.play('beep');
   }else{$('countov').hidden=true;tstate='play';}
   break;
  case 'scene':{
   if(tstate!=='play'&&tstate!=='count')break;
   const now=performance.now();
   if(m.ar&&Math.abs(m.ar-feedAr)>0.01){feedAr=m.ar;fit();}
   if(m.ch)chars=m.ch;
   storePlayers(m,now);
   scene=m;sceneAt=now;
   snd.music(!!m.mu);
   break;}
  case 'snd':(m.l||[]).forEach(n=>snd.play(n));break;
  case 'res':{
   tstate='res';snd.music(false);vstop();
   $('countov').hidden=true;$('lobby').hidden=true;
   $('rtitle').textContent=m.title;$('winner').textContent=m.winner;$('winner').style.color=m.wc>=0?COLORS[m.wc]:'#fff';
   $('rank').innerHTML='';
   m.rank.forEach((x,pos)=>{
    const d=document.createElement('div');d.className='rk';d.style.borderColor=COLORS[x.i];
    const a=document.createElement('span');a.textContent=(pos+1)+'º  Jogador '+(x.i+1)+' ('+charName(chars[x.i])+')';
    const b=document.createElement('span');b.textContent=x.txt;
    d.append(a,b);$('rank').appendChild(d);
   });
   $('res').hidden=false;$('again').focus();break;}
  case 'menu':vstop();goLobby();break;
  case 'video':loadVideoSrc(new URL(m.src,location.href).href);break;
  case 'videofile':{
   if(vidUrl)URL.revokeObjectURL(vidUrl);
   vidUrl=URL.createObjectURL(new Blob([m.data],{type:m.mime||'video/mp4'}));
   loadVideoSrc(vidUrl);break;}
  case 'vplay':vplay();break;
  case 'vstop':vstop();break;
 }
}

$('go').onclick=()=>{snd.ctx();send({type:'start'});};
$('again').onclick=()=>{snd.ctx();send({type:'start'});};
$('tomenu').onclick=()=>send({type:'menu'});
$('sample').onclick=()=>send({type:'sample'});
$('fs').onclick=()=>{snd.ctx();if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{});};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(tstate==='play'||tstate==='count'))send({type:'menu'});});

buildMenu();
startPeer();
setInterval(()=>{if(tstate==='lobby'||tstate==='wait')renderPicks(true);},120);
</script>
</body></html>
